<!-- ★★★ ArkWeb 兼容 shim: 桌面版通过 window.chrome.webview.postMessage 回传诊断/结果。
     ArkWeb 不存在 window.chrome.webview，注入一个 shim 转给 window.__nativeBridge,
     由 ArkTS javaScriptProxy 接收。注意 ArkWeb 的 javaScriptProxy 暴露的是对象
     (name.methodList)，因此必须调用 __nativeBridge.onMsg(...)，与 WebView2 语义不同。 -->
<script>
(function(){
  if (!window.chrome) window.chrome = {};
  window.chrome.webview = {
    postMessage: function(o){
      try {
        var b = window.__nativeBridge;
        if (b && typeof b.onMsg === 'function') b.onMsg(JSON.stringify(o));
      } catch(e){}
    }
  };
})();
</script>

<!-- ★★★ 域名锁破解: CMG wasm 数据段内嵌 EM_ASM 函数 theAnswer(),
       通过 eval("self.location.host"/"self.location.protocol"/"self.location.href")
       读取当前运行域名, 并与硬编码的 "yangshipin.cn" 校验。
       我们的页面跑在 127.0.0.1:18888, 域名校验失败 → wasm 在 fetch CMGPlayer.json 之前
       就 abort → 解密器保持恒等直通(same=Y)。
     修复: 在任何 CMG 脚本加载前劫持全局 eval, 把 location 相关表达式伪装成 yangshipin.cn/https:。
       (重写 window.eval 后, 生成代码里的 eval(name) 变为对我们函数的间接调用, 从而生效。)
     同时记录所有 eval 字符串前 80 字符, 便于确认 wasm 到底 eval 了什么。 -->
<!-- ★★★ 域名锁破解 (v2 鲁棒版):
     wasm 的 theAnswer() 通过 eval(name) 读取 location 并校验域名。
     旧版只匹配"单一属性"表达式(如 self.location.host), 但 wasm 常拼接复合表达式
     (如 self.location.protocol+"//"+self.location.host), 旧版漏匹配 → 返回真实 127.0.0.1 →
     域名校验失败 → wasm 不抓 CMGPlayer.json → 解密恒等(same=Y) → 花屏。
     新版: 对任何含 "location" 的 eval 表达式, 用伪 location 对象求值,
     使所有 location 读取(含复合拼接)都返回 yangshipin.cn/https:。 -->
<script>
(function(){
  var _eval = window.eval;
  // ★ 频道可变的密钥种子 (2026-08-15): CMG wasm 用 activeURL/location 里的 pid 派生解密密钥。
  //   切频道必须同步刷新种子, 否则新频道 TS 用旧频道密钥解密 → 花屏/绿屏(音频不受影响)。
  window.__cmgSeedPid = window.__cmgSeedPid || '600001859';
  function __seedHref(){ return 'https://yangshipin.cn/tv/home?pid=' + window.__cmgSeedPid; }
  function __seedSearch(){ return '?pid=' + window.__cmgSeedPid; }
  // 伪 location: 让任何 location 表达式(含复合拼接)都返回 yangshipin.cn (href/search 随频道动态)
  var fakeLoc = {
    host:'yangshipin.cn', hostname:'yangshipin.cn', protocol:'https:',
    get href(){ return __seedHref(); },
    origin:'https://yangshipin.cn', port:'',
    pathname:'/tv/home', get search(){ return __seedSearch(); }, hash:''
  };
  var _n = 0, _na = 0;
  window.eval = function(s){
    // ★ 诊断: 记录 wasm .eval 的所有表达式(含非 location), 上限 300 条 (已静默)
    if (typeof s === 'string') {
      try { if (_na < 300) { _na++; /* if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[EVAL-ALL] '+s.substring(0,140)}); */ } } catch(e){}
    }
    if (typeof s === 'string' && /location/.test(s)) {
      try {
        // 用伪 location 在隔离作用域里求值, 覆盖 self/window/document/location 四种写法
        var fn = new Function('self','window','document','location','navigator','return (' + s + ');');
        var r = fn({location:fakeLoc}, {location:fakeLoc}, {location:fakeLoc}, fakeLoc, {});
        if (typeof r === 'string') {
          // if (_n < 80) { _n++; try { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[EVAL-SPOOF] '+s.substring(0,90)+' -> '+r}); } catch(e){} }
          return r;
        }
        // 非字符串结果: 强行用伪 location 重新拼一个字符串返回, 避免退回真实 eval 泄露 127.0.0.1
        try { var r2 = String(r); /* if (_n < 80) { _n++; if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[EVAL-SPOOF-nonstr] '+s.substring(0,90)+' -> '+r2}); } */ return r2; } catch(e3){}
      } catch(e) {
        // try { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({err:'[EVAL] 复合求值失败: '+s.substring(0,80)+' :: '+e.message}); } catch(e2){}
      }
    }
    return _eval.call(this, s);
  };
  try { /* if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[EVAL] 域名锁 eval 劫持(鲁棒版)已安装'}); */ } catch(e){}
})();
</script>

<!-- ★★★ 主线程 location 伪装 (覆盖派发器 fG[0x909] 的直读 self.location.href)
     cmg.worker.js 作为主线程脚本加载, wasm 与派发器共享 self(=window)。
     派发器 InitPlayer 分支直接读 self.location.href(不走 eval, 故 WEVAL 劫持覆盖不到),
     把它拼成 URL 存进 self 全局, wasm 再读该全局作密钥种子。
     主线程真实 href=http://127.0.0.1:18888/player → 种子错误 → 空密钥表 → 解密恒等(same=Y)。
     此处把主线程 self.location 伪装成 yangshipin.cn, 使派发器拼出的 URL 正确。 -->
<script>
(function(){
  // ★ 频道可变密钥种子 (2026-08-15): 种子 = activeURL/location 里的 pid。
  //   切频道时 __setChannelSeed(pid) 会刷新这里 → 派发器 InitPlayer 拼出的 URL 种子随之更新,
  //   密钥表按新频道重新派生, 解决「切频道花屏/绿屏、声音正常」问题。
  window.__cmgSeedPid = window.__cmgSeedPid || '600001859';
  function seedHref(){ return 'https://yangshipin.cn/tv/home?pid=' + window.__cmgSeedPid; }
  function seedSearch(){ return '?pid=' + window.__cmgSeedPid; }
  var realHref=(window.location&&window.location.href)||'(未知)';
  var fakeLoc={
    get href(){ return seedHref(); }, protocol:'https:', host:'yangshipin.cn', hostname:'yangshipin.cn',
    port:'', pathname:'/tv/home', get search(){ return seedSearch(); }, hash:'',
    origin:'https://yangshipin.cn',
    assign:function(){}, replace:function(){}, reload:function(){},
    toString:function(){ return seedHref(); }
  };
  var steps=[];
  function applySpoof(){
    // 1) 在 window 实例上定义自有 location 属性 (Chromium 中 window.location 通常不可配置 → 会失败, 仅作尝试)
    try{ Object.defineProperty(window,'location',{value:fakeLoc,configurable:true,writable:false}); steps.push('win-loc:ok'); }catch(e){ steps.push('win-loc:FAIL'); }
    try{ Object.defineProperty(self,'location',{value:fakeLoc,configurable:true,writable:false}); steps.push('self-loc:ok'); }catch(e){ steps.push('self-loc:FAIL'); }
    // 2) 改写 Location.prototype 的各 getter (直接用全局 Location 构造函数, 比 getPrototypeOf 可靠)
    try{
      var LP=(typeof Location!=='undefined')?Location.prototype:Object.getPrototypeOf(window.location);
      [['href',seedHref],['host',function(){return 'yangshipin.cn';}],['hostname',function(){return 'yangshipin.cn';}],['protocol',function(){return 'https:';}],['origin',function(){return 'https://yangshipin.cn';}],['pathname',function(){return '/tv/home';}],['search',seedSearch]].forEach(function(p){
        try{ Object.defineProperty(LP,p[0],{get:p[1],configurable:true}); steps.push('proto-'+p[0]+':ok'); }catch(e){ steps.push('proto-'+p[0]+':FAIL'); }
      });
    }catch(e){ steps.push('proto:FAIL:'+e.message); }
    // 3) 终极兜底: 改写 Window.prototype.location getter 直接返回 fakeLoc (影响 self.location 取值)
    try{
      var WP=Object.getPrototypeOf(window);
      Object.defineProperty(WP,'location',{get:function(){return fakeLoc;},configurable:true});
      steps.push('winproto-loc:ok');
    }catch(e){ steps.push('winproto-loc:FAIL'); }
    // 4) 预置 activeURL: 派发器会 self['activeURL']=self['activeURL'].replace(...), 若未定义会抛错被吞 → 密钥不加载
    try{ Object.defineProperty(window,'activeURL',{value:seedHref(),configurable:true}); }catch(e){}
    try{ Object.defineProperty(self,'activeURL',{value:seedHref(),configurable:true}); }catch(e){}
    try{ Object.defineProperty(document,'URL',{value:seedHref(),configurable:true}); }catch(e){}
  }
  applySpoof();
  // 5) 生效验证: 必须回读确认 self.location.href 真的变成 FAKE, 不再假成功
  var nowHref=(self.location&&self.location.href)||'(null)';
  var verified=(nowHref===seedHref());
  // if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[LOC-SPOOF] steps=['+steps.join(',')+'] verified='+verified+' now='+nowHref});
  // ★ 切频道种子刷新入口 (供 __startM3u8 调用): 更新种子并重新应用所有 location/activeURL 伪装
  window.__setChannelSeed = function(pid){
    if(!pid) return;
    window.__cmgSeedPid = String(pid);
    applySpoof();
    // if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[SEED] 频道种子已刷新 pid='+window.__cmgSeedPid+' href='+seedHref()});
  };
})();
</script>

<!-- ★★★ 网络层拦截 (必须在 cmg.worker.js / hls.cmg.js 之前安装, 让 emscripten 捕获到被劫持的 fetch)
     ★★ 关键修复(2026-07-15): 之前只代理 cctv.cn/yangshipin.cn, 但 get_live_info 返回的 m3u8/TS
     URL 指向 CDN 域名(waxen.cn 等), 不在列表中 → 直连 → 切换频道时 "no EXT3U delimiter"。
     改为代理所有外部 HTTP(S) URL, 确保 m3u8/TS/KEY 全部走 Go 代理(自带 Referer/TLS 指纹)。 -->
<script>
(function(){
  var PROXY='http://127.0.0.1:18888/media/';
  function rewrite(url){
    if(!url) return url;
    // ★ 任何含 CMGPlayer.json 的请求都路由到本地配置 (容忍 wasm 拼出的畸形 URL / 127.0.0.1 本地路径)
    if(/CMGPlayer\.json/i.test(url)) return '/Library/CMGPlayer.json';
    // ★★ 关键修复(2026-08-13): 已指向代理的 URL(含 /media?u= /media/ 或 127.0.0.1/localhost/192.168 代理段)
    //   必须直接放行, 否则 /media?u=... 会被再次匹配 ^https?:// 而递归嵌套 N 层 → m3u8/TS 全错 → 花屏/无声。
    if(/\/media\?u=/i.test(url)) return url;
    if(/\/media\//i.test(url)) return url;
    if(url.indexOf('127.0.0.1')>=0||url.indexOf('localhost')>=0) return url;
    if(/https?:\/\/192\.168\./i.test(url) && url.indexOf(':18888')>=0) return url;
    // ★ 代理所有外部 HTTP(S) URL (CDN m3u8/TS/解密 key 全部走 Go 代理)
    if(/^https?:\/\//i.test(url)) return PROXY+encodeURIComponent(url);
    return url;
  }
  var _fetch=window.fetch?window.fetch.bind(window):null;
  if(_fetch){ window.fetch=function(input,init){
    var u=(typeof input==='string')?input:(input&&input.url?input.url:null);
    // try{ if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[net-RAW] fetch '+(typeof input==='string'?input:(input&&input.url?input.url:'?')).substring(0,140)}); }catch(e){}
    var ru=rewrite(u);
    if(ru!==u){
      // try{ window.chrome.webview.postMessage({log:'[net] fetch→proxy '+String(u).substring(0,90)}); }catch(e){}
      if(typeof input!=='string'&&input){ try{ input=new Request(ru,input); }catch(e){ input=ru; } } else input=ru;
    }
    return _fetch(input,init);
  };}
  var _open=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(){
    if(arguments.length>=2){
      // try{ if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[net-RAW] xhr '+(arguments[0]||'GET')+' '+String(arguments[1]).substring(0,140)}); }catch(e){}
      var ru=rewrite(arguments[1]);
      if(ru!==arguments[1]){
        // try{ window.chrome.webview.postMessage({log:'[net] xhr→proxy '+String(arguments[1]).substring(0,90)}); }catch(e){}
        arguments[1]=ru;
      }
    }
    return _open.apply(this,arguments);
  };
  /* try{ window.chrome.webview.postMessage({log:'[net] 网络拦截已安装 (cctv/yangshipin → /media)'}); }catch(e){} */
})();
</script>

     复刻官方 liveInit 的时序: o=CMGDecModule(); window.CNTVH5PlayerModule=o; 等 onRuntimeInitialized 后播放。
     hls.cmg.js 的 demux (jC 构造器) 直接读取全局 CNTVH5PlayerModule, 未定义即 ReferenceError。 -->

(function(){

      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({err:'CMGDecModule 未定义 (cmg.worker.js 未加载?)'});

    //   ★★ 双保险触发 window.__cmgReady (2026-08-16):
    //     1) mod.ready Promise (Emscripten 1.40+ 标准)
    //     2) m.onRuntimeInitialized 兜底 (任何版本都支持; 用户覆盖前先保留原函数)
    //   保证不管 CMGDecModule 是否暴露 mod.ready, 首播时轮询 window.__cmgReady 一定能等到。

      var m = CMGDecModule();
      var __readyMarked = false;
      var __markReady = function(source){
        if(__readyMarked) return;
        __readyMarked = true;
        window.__cmgReadySource = source || 'unknown';

        window.__cmgReady = true;
        try { if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({type:'cmg',stage:'runtime-ready',source:window.__cmgReadySource}); } catch(e){}

        m.ready.then(function(){ __markReady('ready-promise'); }).catch(function(e){

// ★★★ 密钥表探针: 直接读 CMG wasm 内存(HEAPU8), 对比 InitPlayer/播放前后, 定位密钥表并判断是否为空
//   (比给混淆 wasm 插桩更可靠: 无需知道密钥表地址, 直接从 JS 读 wasm 线性内存做 diff)
var __ktblDone = false;
function installKeyTableProbe(mod){
  if (__ktblDone) return; __ktblDone = true;
  function getHeap(){
    try { if (mod.HEAPU8) return mod.HEAPU8; } catch(e){}
    try { if (mod.asm && mod.asm.memory) return new Uint8Array(mod.asm.memory.buffer); } catch(e){}
    return null;
  }
  function snap(H){ var a = new Uint8Array(H.length); a.set(H); return a; }
  function hex(b, off, n){ var s=''; for(var i=0;i<n;i++){ var x=b[off+i]>>>0; s+=('0'+x.toString(16)).slice(-2);} return s; }
  var tries=0;
  function waitHeap(cb){
    var H=getHeap();
    if(H){cb(H);return;}
    if(tries++<60) setTimeout(function(){waitHeap(cb);},100);
    else /* if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[KTBL] HEAPU8 不可用'}) */;
  }
  waitHeap(function(H){
    var S1=snap(H);
    /* if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[KTBL] S1 len='+S1.length}); */
    setTimeout(function(){
      var Sa=snap(H);
      setTimeout(function(){
        var Sb=snap(H);
        var BLK=64, cand=[], nzSa=0;
        for(var off=0; off+BLK<=Sa.length; off+=BLK){
          var nz=false; for(var k=0;k<BLK;k++){ if(Sa[off+k]!==0){nz=true;break;} }
          if(nz) nzSa++;
          var stable=true; for(var k=0;k<BLK;k++){ if(Sa[off+k]!==Sb[off+k]){stable=false;break;} }
          if(!stable) continue;
          var chg=false; for(var k=0;k<BLK;k++){ if(Sa[off+k]!==S1[off+k]){chg=true;break;} }
          if(chg && nz) cand.push(off.toString(16)+':'+hex(Sa,off,32));
        }
        /* if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage({log:'[KTBL] 非零块='+nzSa+' 候选密钥块='+cand.length+' 样本='+cand.slice(0,15).join(' | ')}); */
      }, 4000);

}

// ★ CMG 播放
// ★ 切频道修复 v3(2026-08-15 晚): url 后新增 pid 参数。
//   根因: CMG 密钥表在 InitPlayer 时由 self['activeURL']/location(含 pid) 派生, 而该种子被伪装成
//   固定 pid=600001859 (CCTV-1)。切频道只换 m3u8 不换种子 → 新频道视频用旧频道密钥解密 → 花屏/绿屏。
//   v1 用 UnInit→Init 重派生, 但 UnInit 释放模块状态导致 demux 悬空 → 主线程死锁(卡住像暂停)。
//   v2 只重 Init(不 UnInit), CCTV-1→CCTV-2 正常, 但连续 Init 状态累积 → CCTV-3 起仍卡死。
//   ★ v3: 切频道时**完整重建 CMG 模块**(__cmgRebuild: 销毁旧→建新→等 wasm 就绪→go),
//     hls.js demux 每次 new Hls 时读取全局 CNTVH5PlayerModule → 新模块新 ctx 全新状态, 无累积污染。
window.__startM3u8 = function(url, pid, channelName, icon) {
    var session=++playerSession;
    setMediaChannelMetadata(channelName, pid, icon);
    retryCount=0; recoveryPending=false; clearPlayerTimers();
    window.__activeM3u8Url=url;
    window.__activeM3u8Base=url.split('?')[0];
    setPlayerState('PREPARING','等待解密器',session);
    // ★ 2026-08-16 诊断: 记录首播/切台时的关键状态
    try {
      if(window.chrome && window.chrome.webview) window.chrome.webview.postMessage({
        log:'[START] pid='+(pid||'?')+' cmgReady='+!!(window.__cmgReady)+' hasMod='+!!(window.CNTVH5PlayerModule)+' hasReady='+!!(window.CNTVH5PlayerModule&&window.CNTVH5PlayerModule.ready)
      });
    } catch(_e){}
    try { if (pid && window.__setChannelSeed) window.__setChannelSeed(pid); } catch(e){}
    if (hls) { try { hls.destroy(); } catch(e){}; hls = null; }
    try { v.pause(); v.src = ''; v.load(); } catch(e){}
    if (typeof Hls==='undefined'||!Hls.isSupported()){setPlayerState('ERROR','Hls不支持',session);return false}
    if (typeof window.CNTVH5PlayerModule === 'undefined'){setPlayerState('ERROR','CMG解密模块未初始化',session);return false}
    // ★ 媒体请求由页面顶部网络拦截统一改写到 /media；实际启动统一走状态机 startHls。
    function go(mod){
        setPlayerState('PREPARING','等待 CMG 解密包装完成',session);
        waitCmgPipeline(mod,session,function(err){
            if(session!==playerSession)return;
            if(err){setPlayerState('ERROR',err.message,session);return;}
            startHls(mod,session);
        });
    }
    // ★ 切频道: 非首播时完整重建 CMG 模块(销毁旧→建新→等就绪→go), 首播直接用现有模块。
    //   重建后 main.go 的 wrap 轮询会自动重新 wrap 新模块(检测 CNTVH5PlayerModule 引用变化)。
    var isSwitch = (window.__cmgStarted === true);
    if (isSwitch && window.__cmgRebuild) {
        // ★ 优先使用后台预建模块（ArkTS 在鉴权网络往返期间已触发 __cmgPrefetch）。
        //   预建完成且 pid 匹配 → 直接切换全局引用并 go，跳过重建等待，显著缩短换台时间。
        if (window.__cmgPrefetchedReady === true && String(window.__cmgPrefetchedPid||'') === String(pid) && window.__cmgPrefetchedMod) {
            var pfMod = window.__cmgPrefetchedMod;
            window.__cmgPrefetchedMod = null;
            window.__cmgPrefetchedReady = false;
            window.__cmgPrefetchBusy = false;
            // 与 __cmgRebuild 相同的状态清理：清 VMPATCH3 定时器、重置 wrap 状态，再切换全局模块
            try{ if(window.__vmTimers){ for(var i=0;i<window.__vmTimers.length;i++){ try{ clearInterval(window.__vmTimers[i]); }catch(e){} } } window.__vmTimers=[]; }catch(e){}
            window.__cmgMod=null;
            window.__cmgModWrapped=false;
            window.__cmgCtxPtr=0;
            window.__initForced=0;
            window.__cmgResetCount=0;
            window.__cmgWrapped=false;
            window.__dec1=0; window.__upd1=0; window.__initLog=0; window.__uninitLog=0;
            // ★ 换下旧模块：登记新模块 + 释放旧实例（此时 hls 已 destroy，旧模块不再被 demux 引用）
            var __oldMod = window.CNTVH5PlayerModule;
            window.CNTVH5PlayerModule = pfMod;
            try{ if(window.__cmgTrack) window.__cmgTrack(pfMod); }catch(e){}
            try{ if(window.__cmgRelease) window.__cmgRelease(__oldMod); }catch(e){}
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[SWITCH] pid='+(pid||'?')+' 使用预建模块, 跳过重建 实例数='+(window.__cmgInstances?window.__cmgInstances.length:-1)});
            go(pfMod);
            return;
        }
        // ★ 2026-08-30: 必须在此处设置 __cmgStarted=true，确保后续切台时 __cmgPrefetch 能正常运行。
        //   否则 __cmgPrefetch 因 __cmgStarted===false 而直接 return false，切台只能走 rebuild 慢路径。
        window.__cmgStarted = true;
        try {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({log:'[SWITCH] pid='+(pid||'?')+' seed='+(window.__cmgSeedPid||'?')+' 重建模块'});
            window.__cmgRebuild(pid, function(err){
                if(err){ setPlayerState('ERROR',err.message||String(err),session); return; }
                var m2 = window.CNTVH5PlayerModule;
                // ★ 等 wasm 就绪后再 loadSource, 否则首片 demux 时 wasm 未编译会失败
                if (m2 && m2.ready && typeof m2.ready.then === 'function') {
                    m2.ready.then(function(){ go(m2); }).catch(function(err){ setPlayerState('ERROR','CMG wasm错误：'+(err&&err.message?err.message:err),session); });
                } else if (m2) {
                    go(m2);
                } else {
                    setPlayerState('ERROR','CMG重建后模块为空',session);
                }
            });
        } catch(e){
            setPlayerState('ERROR','CMG重建异常：'+e.message,session);
        }
        return;
    }
    // ★ 首播: 等 window.__cmgReady 后再 go（解决 CMGDecModule 无 mod.ready Promise 的竞态）
    //   旧逻辑用 mod.ready.then 等待 CMG wasm 就绪，但改造版 CMGDecModule 不暴露 mod.ready
    //   → else 分支立即 go(mod) → hls.loadSource → 首个 TS demux 时 wasm 未就绪 → 解密失败 → 绿屏。
    //   新逻辑统一用 window.__cmgReady 作为就绪信号（__cmgCreateInstance 已设置），与切台同路径。
    //   ★★★ 2026-08-16 加强: 不依赖 mod.ready 是否存在, 统一轮询 __cmgReady, 跟切台走相同路径
    //   (切台用轮询, 首播也用轮询, 路径一致更稳)
    var mod = window.CNTVH5PlayerModule;
    function __waitFirstPlay() {
      if (window.__cmgReady) { go(mod); return; }
      var __tries = 0;
      var __iv = setInterval(function() {
        __tries++;
        if (window.__cmgReady) { clearInterval(__iv); go(mod); }
        else if (__tries > 600) {
          clearInterval(__iv);
          // ★ 超时必须停止，不能伪造就绪后继续解密首片，否则会产生绿屏。
          setPlayerState('ERROR','CMG wasm 初始化超时，已阻止播放',session);
        }
      }, 50);
    }
    // ★ 统一路径: 不论 mod.ready 是否存在, 都走轮询 __cmgReady
    //   这是与 __cmgRebuild 完全相同的等待机制, 避免首播路径与切台路径不一致导致的不同行为
    __waitFirstPlay();
    // ★ __cmgStarted 已在 isSwitch 分支和此处设置，确保所有路径都覆盖
    window.__cmgStarted = true;
    return true;
};
</script>

<!-- ===== yspticket 生成器 (复刻官方 _c + RJq7sO71JF.wasm 的 AES-CTR + PCG 尾缀) =====
     wasm 由 C# 在运行时以 base64 注入到 window.__yspTicketWasmB64。
     攻破要点 (详见《央视频定制APP技术白皮书 V3.0》):
       1) 官方 _c(livepid, ts, cnlid, guid, yspappid, appVer) 内部调用
          wasm 的 _aes_encrypt_ctr (导出名 T) + _get_encrypt_str_len (导出名 S) + _malloc (导出名 R)。
       2) 明文布局 = livepid + sep + ts + sep + guid + sep + yspappid + PCG尾缀(11字节),
          总长由 S() 权威返回 = 62 字节。cnlid / appVer 参与传参但实际不参与明文 (已 XOR 验证)。
       3) AES-CTR 密钥/IV 是 wasm 内常量; 尾缀 11 字节是 PCG 随机数, 种子来自 wasm 的
          _time import (浏览器里本应 Date.now()/1000)。这里把种子固定为认证返回的 ts (秒),
          既作 _c 第2参数、又作 _time 种子, 与官方调用一致, 且便于复现/调试。
       4) wasm import 全部挂在 module "a" 下: a.a=内存, a.b=表,
          a.O=is_browser_environment 必须返回 1 (否则 CTR 走非浏览器分支),
          a.d=_time(ptr) 写入种子并返回; 其余 import 一律返回 0 (本路径不会用到)。
-->
<script>
// ★★ 关键修复 (2026-07-12): 原 __genYspTicket 是 async, 返回 Promise。
//    WebView2 的 ExecuteScriptAsync 不会 await Promise, 会把它序列化成 {} (Object),
//    导致 C# 侧 GetString() 报 "requires an element of type 'String', but ... 'Object'",
//    随即回退到过期硬编码 yspticket → live 401。
//    修复: wasm 在页面加载时预实例化一次 (与 cKey 同款异步 instantiate 一次),
//         __genYspTicket 改为同步函数直接 return hex 字符串, ExecuteScriptAsync 就能拿到 String。
//         种子用模块级 __yspSeed, 每次调用前设置; import d(_time) 读它 → 按 ts 确定性输出。
//         官方 SPA 亦是全程复用同一 wasm 实例, 此写法更贴合官方行为。
(function () {
  window.__yspLoadErr = '';
  var __yspReady = false, __yspEx = null, __yspMem = null, __yspSeed = 0;
  window.__yspReadyFlag = function () { return __yspReady; };   // 供 Index.ets waitWasmReady() 轮询

  function initYspWasm() {
    if (!window.__yspTicketWasmB64) {
      window.__yspLoadErr = 'yspticket wasm 未注入';
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ error: 'yspticket wasm 未注入' });
      return;
    }
    try {
      var bin = atob(window.__yspTicketWasmB64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

      // 内存/表 必须是真实的 WebAssembly 对象 (wasm 以 a.a / a.b 导入)
      var mem = new WebAssembly.Memory({ initial: 256, maximum: 256 });
      var tbl = new WebAssembly.Table({ initial: 1024, maximum: 4096, element: 'anyfunc' });

      // Emscripten 风格 import: module "a", 用 Proxy 兜底其余未知函数 import
      var importObject = new Proxy({}, {
        get: function (t, mod) {
          return new Proxy({}, {
            get: function (t2, fn) {
              if (fn === 'a') return mem;     // 内存导入 a.a
              if (fn === 'b') return tbl;     // 表导入 a.b
              if (fn === 'O') return function () { return 1; };              // is_browser_environment -> 必须 1
              if (fn === 'd') return function (p) { if (p) new Int32Array(mem.buffer)[p >> 2] = __yspSeed; return __yspSeed; }; // _time(ptr)
              return function () { return 0; };                              // 其余 import 一律返回 0
            }

      WebAssembly.instantiate(bytes, importObject).then(function (r) {

      }).catch(function (e) {
        window.__yspLoadErr = 'yspticket wasm 编译失败:' + e.message;
        if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ error: 'yspticket wasm 编译失败:' + e.message });
      });
    } catch (e) {
      window.__yspLoadErr = 'yspticket wasm 解码失败:' + e.message;
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ error: 'yspticket wasm 解码失败:' + e.message });
    }
  }
  initYspWasm();   // 页面加载即预实例化, 播放时早已就绪

  window.__genYspTicket = function (livepid, tsSec, cnlid, guid, yspappid, appVer) {
    try {
      if (!__yspReady || !__yspEx) { /* window.chrome.webview.postMessage({ error: 'yspticket wasm 未就绪' }); */ return ''; }
